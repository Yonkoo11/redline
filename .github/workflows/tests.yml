name: tests
on: [push, pull_request]
permissions: { contents: read }
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: redline }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
        working-directory: redline
      # Checked out into a directory named `redline` because the repository root IS the plugin
      # package: `hermes plugins install` clones it to plugins/redline/ and imports it by that
      # name. Tests import `redline.policy`, so the parent has to be on the path.
      - run: python -m pytest tests -q
        working-directory: redline
      # The page has its own logic and its own way of breaking: a record shape it has never seen
      # threw inside a render and emptied the live site. Node's built-in runner, no dependencies.
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --test site/src/lib/
        working-directory: redline
